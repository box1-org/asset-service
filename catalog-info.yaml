apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: asset-service
  description: "Represent connected industrial equipment at multiple sites."
  annotations:
    github.com/project-slug: box1-org/asset-service
    backstage.io/kubernetes-id: asset-service
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://github.com/box1-org/asset-service/
    janus-idp.io/tekton: asset-service
    argocd/instance-name: openshift-gitops
    argocd/app-selector: backstage.io/kubernetes-id=asset-service
    box1.org/template-version: "1.1.0"
  tags: [java, quarkus, maven, tekton, gitops]
  links:
    - url: https://github.com/box1-org/asset-service
      title: Source Repository
      icon: github
    - url: https://asset-service-dev.apps.ocp.box1.org/q/swagger-ui/
      title: Swagger UI — test endpoints
      icon: code
    - url: https://asset-service-dev.apps.ocp.box1.org/q/openapi
      title: OpenAPI specification
      icon: code
    - url: https://asset-service-dev.apps.ocp.box1.org
      title: Application Route (after first release)
    - url: https://github.com/box1-org/box1-workloads-dev/tree/main/workloads/asset-service
      title: Desired deployment configuration
    - url: https://devspaces.apps.ocp.box1.org/#https://github.com/box1-org/asset-service
      title: Open in Dev Spaces
      icon: code
    # Add actual service-specific observability URLs
    # when dashboards and log views exist.
spec:
  type: service
  lifecycle: experimental
  owner: "user:default/mike"
  # Add when the corresponding System entity exists:
  # system: box1-demo
  providesApis:
    - asset-service-api
    - box1-telemetry-events
  consumesApis:
    - box1-telemetry-events
  dependsOn:
    - resource:asset-service-postgres
    - resource:box1-kafka
    - resource:keycloak-box1
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: asset-service-api
  description: OpenAPI contract for asset-service
  tags: [quarkus, openapi]
spec:
  type: openapi
  lifecycle: experimental
  owner: "user:default/mike"
  definition:
    $text: https://asset-service-dev.apps.ocp.box1.org/q/openapi
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: box1-telemetry-events
  title: box1.telemetry.events.v1
  description: Kafka topic box1.telemetry.events.v1, produced by asset-service through its transactional outbox. Contracts are owned by box1-ops-contracts.
  tags: [kafka, events, asyncapi]
  links:
    - url: https://github.com/box1-org/box1-ops-contracts/blob/main/TOPICS.md
      title: Topic ownership and consumer groups
      icon: docs
spec:
  type: asyncapi
  lifecycle: experimental
  owner: "user:default/mike"
  definition: |
    asyncapi: 2.6.0
    info:
      title: box1.telemetry.events.v1
      version: v1
      description: >-
        Delivery is at least once; consumers record eventId transactionally.
        Partition key assetId. Retention 2d.
    servers:
      dev:
        url: box1-kafka-kafka-bootstrap.box1-kafka.svc:9092
        protocol: kafka
    channels:
      box1.telemetry.events.v1:
        publish:
          summary: Events published by asset-service
          message:
            oneOf:
            - name: equipment.reading.v1
              title: equipment.reading.v1
              summary: v1 envelope carrying equipment.reading (see https://github.com/box1-org/box1-ops-contracts/blob/main/events/v1/equipment.reading.schema.json)
              contentType: application/json
            - name: equipment.threshold-exceeded.v1
              title: equipment.threshold-exceeded.v1
              summary: v1 envelope carrying equipment.threshold-exceeded (see https://github.com/box1-org/box1-ops-contracts/blob/main/events/v1/equipment.threshold-exceeded.schema.json)
              contentType: application/json
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: asset-service-postgres
  description: PostgreSQL database asset_service owned by asset-service (asset-service-dev namespace)
  tags: [postgresql, database]
  links:
    - url: https://github.com/box1-org/box1-workloads-dev/blob/main/workloads/asset-service/postgres.yaml
      title: Database manifest
spec:
  type: database
  lifecycle: experimental
  owner: "user:default/mike"
