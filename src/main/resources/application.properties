quarkus.application.name=asset-service
quarkus.http.host=0.0.0.0
greeting.prefix=${GREETING_PREFIX:Hello}
quarkus.smallrye-openapi.info-title=asset-service REST API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Telemetry ingestion and reads use bearer tokens from Keycloak realm box1 with audience asset-service. The /api/v1/control endpoints serve the load and chaos console and need a browser login with the chaos-operator role. Errors are application/problem+json with a stable code.
# Jib pushes directly to the registry. Build/push are opt-in at build time.
quarkus.container-image.builder=jib
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime@sha256:cfa544effa28c5c57197a4c9d460812e70efc0965e6f518e1c2e787ff3cb9335
quarkus.jib.platforms=linux/amd64
quarkus.jib.use-current-timestamp=false

# The catalog reads the deployed contract; Swagger uses the public HTTPS Route.
%prod.quarkus.smallrye-openapi.servers=${PUBLIC_API_URL:https://asset-service-dev.apps.ocp.box1.org}
quarkus.swagger-ui.always-include=true
# Allow Developer Hub's API Definition tester to call this service directly.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://developer-hub.apps.ocp.box1.org
quarkus.http.cors.methods=GET,HEAD,OPTIONS,POST,PUT,PATCH,DELETE
quarkus.http.cors.access-control-allow-credentials=false







# ---------------------------------------------------------------------------
# Asset telemetry service (box1-docs#15). Decisions D-002 to D-011 are recorded in
# box1-docs agent-runs/15-telemetry-service/decisions/.
# ---------------------------------------------------------------------------

quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Correlation-ID,traceparent
# Ingestion bodies are checked at 4 KiB by the pipeline; this outer limit only stops abuse early.
quarkus.http.limits.max-body-size=16K
quarkus.jackson.fail-on-unknown-properties=true

# Access (D-002). Golden Path smoke paths stay anonymous because box1-quarkus-smoke requires them.
quarkus.http.auth.proactive=false
quarkus.http.auth.permission.smoke.paths=/api/greetings,/api/info,/q/*,/signed-out.html
quarkus.http.auth.permission.smoke.policy=permit
quarkus.http.auth.permission.data.paths=/api/v1/telemetry/*,/api/v1/assets/*,/api/v1/alerts
quarkus.http.auth.permission.data.policy=authenticated
quarkus.http.auth.permission.console.paths=/console,/console/*,/api/v1/control/*
quarkus.http.auth.permission.console.policy=chaos-operator
quarkus.http.auth.policy.chaos-operator.roles-allowed=chaos-operator
quarkus.http.auth.permission.everything-else.paths=/*
quarkus.http.auth.permission.everything-else.policy=deny

# Keycloak realm box1 (RH-SSO 7.6 keeps the /auth context path). Public client, PKCE, no client secret (D-013).
# Default tenant: bearer tokens only, so an anonymous API call gets 401, never a login redirect.
quarkus.oidc.auth-server-url=${ASSET_OIDC_URL:https://keycloak.apps.ocp.box1.org/auth/realms/box1}
quarkus.oidc.client-id=${ASSET_OIDC_CLIENT_ID:asset-service}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=asset-service
quarkus.oidc.token.principal-claim=preferred_username
# Only tokens issued to this client: Keycloak adds aud asset-service to other clients' tokens when the user holds
# asset-service roles, so the audience alone is not enough (security review SEC-3).
quarkus.oidc.token.required-claims.azp=asset-service
# Roles come only from this client's own claim, never from a top-level groups claim (inventory-run lesson).
quarkus.oidc.roles.role-claim-path=resource_access/asset-service/roles
quarkus.oidc.roles.source=accesstoken
# Console tenant: the browser login (authorization code + PKCE) for the page and its control API.
# The console tenant is chosen by path in PathTenantResolver, never by a session cookie.
quarkus.oidc.console.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc.console.client-id=${quarkus.oidc.client-id}
quarkus.oidc.console.application-type=web-app
quarkus.oidc.console.token.audience=asset-service
quarkus.oidc.console.token.principal-claim=preferred_username
quarkus.oidc.console.token.required-claims.azp=asset-service
quarkus.oidc.console.roles.role-claim-path=resource_access/asset-service/roles
quarkus.oidc.console.roles.source=accesstoken
quarkus.oidc.console.authentication.pkce-required=true
quarkus.oidc.console.authentication.redirect-path=/console/callback
quarkus.oidc.console.authentication.restore-path-after-redirect=true
quarkus.oidc.console.authentication.cookie-same-site=strict
quarkus.oidc.console.authentication.cookie-path=/
# The Route terminates TLS at the edge and forwards plain HTTP: build https redirect URIs and mark cookies Secure
# (security review SEC-1). Local plain-HTTP runs override these two.
quarkus.oidc.console.authentication.force-redirect-https-scheme=true
quarkus.oidc.console.authentication.cookie-force-secure=true
quarkus.oidc.console.authentication.java-script-auto-redirect=false
quarkus.oidc.console.token-state-manager.split-tokens=true
quarkus.oidc.console.logout.path=/console/logout
quarkus.oidc.console.logout.post-logout-path=/signed-out.html

# Browser hardening for the console and its sign-out page (security review SEC-4). The page has no inline script or style.
quarkus.http.filter.console-headers.matches=/console(/.*)?|/signed-out\\.html
quarkus.http.filter.console-headers.header."Content-Security-Policy"=default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'
quarkus.http.filter.console-headers.header."X-Frame-Options"=DENY
quarkus.http.filter.console-headers.header."X-Content-Type-Options"=nosniff
quarkus.http.filter.console-headers.header."Referrer-Policy"=no-referrer
quarkus.http.filter.console-headers.header."Strict-Transport-Security"=max-age=31536000
quarkus.http.filter.console-headers.header."Cache-Control"=no-store

# PostgreSQL. JDBC URL, username and password come from the environment (Secret reference) at runtime.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.additional-jdbc-properties.logServerErrorDetail=false
quarkus.datasource.health.enabled=false
quarkus.flyway.migrate-at-start=true
# Wait for PostgreSQL after a node reboot instead of crash-looping; fits the 150 s startup probe (review OPS-7).
quarkus.flyway.connect-retries=20
quarkus.flyway.connect-retries-interval=5S
# Fail fast so the readiness probe (2 s timeout) is not starved by a busy pool (review OPS-10).
quarkus.datasource.jdbc.acquisition-timeout=2S
box1.readiness.database=true

# Kafka (D-010). Bootstrap from KAFKA_BOOTSTRAP_SERVERS.
# No default in production: a missing setting fails startup instead of leaving a Ready pod that cannot publish (OPS-12).
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
%dev.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# No Dev Services: tests use the OIDC WireMock server and, in the containers suite, explicitly named local containers.
quarkus.devservices.enabled=false
mp.messaging.incoming.telemetry-in.connector=smallrye-kafka
mp.messaging.incoming.telemetry-in.topic=box1.telemetry.events.v1
mp.messaging.incoming.telemetry-in.group.id=asset-service
# earliest: readings answered 202 are never skipped by a missing offset; older-than-retention readings are skipped
# without being dead-lettered, and replays deduplicate (reviews MSG-1, ARCH-4; D-010 amended).
mp.messaging.incoming.telemetry-in.auto.offset.reset=earliest
mp.messaging.incoming.telemetry-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.telemetry-in.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.telemetry-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.telemetry-in.dead-letter-queue.topic=box1.telemetry.dlq.v1
mp.messaging.incoming.telemetry-in.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.telemetry-in.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
# A database outage holds records in retries; that must not trip the 60 s default and fail the channel.
mp.messaging.incoming.telemetry-in.throttled.unprocessed-record-max-age.ms=-1
# Kafka is not a readiness dependency (D-010).
mp.messaging.incoming.telemetry-in.health-readiness-enabled=false
mp.messaging.incoming.telemetry-in.tracing-enabled=false

# Traces propagate through the event envelope. Export stays off until a collector exists (box1-docs#22).
quarkus.otel.traces.exporter=none
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none
quarkus.log.console.json.additional-field."service".value=asset-service
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# Ingestion and retention (D-004, D-009)
asset.ingest.max-rate-per-second=${ASSET_INGEST_MAX_RATE:100}
asset.ingest.queue-capacity=${ASSET_PRODUCER_QUEUE:2000}
asset.retention.readings=${ASSET_READING_RETENTION:PT24H}
asset.retention.max-rows=${ASSET_READING_MAX_ROWS:2000000}

# Load and chaos control (D-004, D-006, D-015). Chaos is off, and the allowlist empty, unless the deployment says so.
# Load and chaos control is off unless the deployment turns it on; chaos also needs the allowlist (review ARCH-13).
asset.control.enabled=${ASSET_CONTROL_ENABLED:false}
asset.chaos.enabled=${ASSET_CHAOS_ENABLED:false}
asset.chaos.namespace-allowlist=${ASSET_CHAOS_NAMESPACE_ALLOWLIST:}
asset.chaos.pod-namespace=${POD_NAMESPACE:}
asset.chaos.environment=${ASSET_ENVIRONMENT:unknown}

# Metric policy (D-008). Thresholds and bounds are in the canonical unit.
asset.metrics.temperature.unit=C
asset.metrics.temperature.alternate-units=F
asset.metrics.temperature.min=-50
asset.metrics.temperature.max=250
asset.metrics.temperature.warning=80
asset.metrics.temperature.critical=95
asset.metrics.temperature.clear=75
asset.metrics.temperature.nominal=60
asset.metrics.vibration.unit=mm/s
asset.metrics.vibration.min=0
asset.metrics.vibration.max=100
asset.metrics.vibration.warning=7.1
asset.metrics.vibration.critical=11.2
asset.metrics.vibration.clear=6.0
asset.metrics.vibration.nominal=3.0
asset.metrics.pressure.unit=bar
asset.metrics.pressure.min=0
asset.metrics.pressure.max=50
asset.metrics.pressure.warning=8.0
asset.metrics.pressure.critical=10.0
asset.metrics.pressure.clear=7.5
asset.metrics.pressure.nominal=5.0
asset.metrics.power.unit=kW
asset.metrics.power.min=0
asset.metrics.power.max=5000
asset.metrics.power.warning=400
asset.metrics.power.critical=480
asset.metrics.power.clear=380
asset.metrics.power.nominal=250

# The default test run has no database or broker, because the CI task has no container runtime.
# Tests tagged "containers" use run15-pg and run15-kafka (or any equivalent); run them with -Pcontainers.
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:15432/asset_service}
%test.quarkus.datasource.username=${TEST_DATABASE_USERNAME:asset_service}
%test.quarkus.datasource.password=${TEST_DATABASE_PASSWORD:run15-local-only}
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.scheduler.enabled=false
%test.box1.readiness.database=false
%test.kafka.bootstrap.servers=${TEST_KAFKA:localhost:19092}
%test.quarkus.messaging.kafka.health.enabled=false
%test.mp.messaging.incoming.telemetry-in.enabled=false
# Tests verify tokens against the OIDC WireMock server started by SecurityTest for the whole test run.
%test.quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus/
%test.quarkus.oidc.token.issuer=https://server.example.com
%test.quarkus.oidc.console.token.issuer=https://server.example.com
%test.asset.control.enabled=true
%test.quarkus.oidc.console.authentication.force-redirect-https-scheme=false
%test.quarkus.oidc.console.authentication.cookie-force-secure=false
